
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Registration | Advance Billing System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            background: #183b65;
            color: white;
            padding: 25px 30px;
            border-radius: 12px 12px 0 0;
        }

        .header h2 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .header p {
            color: #dce8f7;
            font-size: 14px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .form-title {
            color: #183b65;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5e0;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2474c5;
            box-shadow: 0 0 0 3px rgba(36,116,197,0.12);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .required {
            color: red;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .submit-btn {
            background: #1769aa;
            color: white;
            flex: 1;
        }

        .submit-btn:hover {
            background: #104e83;
        }

        .reset-btn {
            background: #e5e9ef;
            color: #333;
        }

        .message {
            display: none;
            padding: 13px;
            margin-bottom: 20px;
            border-radius: 7px;
            font-size: 14px;
        }

        .success {
            background: #d9f5e4;
            color: #146c36;
        }

        .error {
            background: #ffe0e0;
            color: #a52222;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            .form-card {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .header h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Advance Billing System with QR</h2>
        <p>Distributor Panel | Customer Management</p>
    </div>

    <div class="form-card">

        <h3 class="form-title">Register New Customer</h3>

        <div id="successMessage" class="message success"></div>
        <div id="errorMessage" class="message error"></div>

        <form id="customerForm">

            {% csrf_token %}

            <div class="form-group">
                <label>Customer Name <span class="required">*</span></label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter customer full name"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@gmail.com"
                    required
                >
            </div>

            <div class="form-group">
                <label>Mobile Number <span class="required">*</span></label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10 digit mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >
            </div>

            <div class="form-group">
                <label>Address <span class="required">*</span></label>
                <textarea
                    id="address"
                    placeholder="Enter complete customer address"
                    required
                ></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="submit-btn" id="submitBtn">
                    Register Customer
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>
            </div>

        </form>

        <a href="/distributor-dashboard/" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>
    const form = document.getElementById("customerForm");
    const successMessage = document.getElementById("successMessage");
    const errorMessage = document.getElementById("errorMessage");
    const submitBtn = document.getElementById("submitBtn");

    function getCSRFToken() {
        return document.querySelector(
            '[name=csrfmiddlewaretoken]'
        ).value;
    }

    function showError(message) {
        successMessage.style.display = "none";
        errorMessage.style.display = "block";
        errorMessage.textContent = message;
    }

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        successMessage.style.display = "none";
        errorMessage.style.display = "none";

        const customerData = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            address: document.getElementById("address").value.trim()
        };

        if (!/^[0-9]{10}$/.test(customerData.phone)) {
            showError("Please enter a valid 10 digit mobile number.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Registering...";

        try {

            const response = await fetch(
                "/api/distributor/customers/",
                {
                    method: "POST",

                    credentials: "same-origin",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCSRFToken()
                    },

                    body: JSON.stringify(customerData)
                }
            );

            const result = await response.json();

            if (response.ok) {

                successMessage.textContent =
                    "Customer registered successfully! Customer ID: " +
                    result.id;

                successMessage.style.display = "block";

                form.reset();

            } else {

                let errorText = "Customer registration failed.";

                if (result.detail) {
                    errorText = result.detail;
                } else {
                    errorText = Object.entries(result)
                        .map(([field, errors]) =>
                            field + ": " +
                            (Array.isArray(errors) ? errors.join(", ") : errors)
                        )
                        .join(" | ");
                }

                showError(errorText);
            }

        } catch (error) {

            showError("Unable to connect to server. Please try again.");

        } finally {

            submitBtn.disabled = false;
            submitBtn.textContent = "Register Customer";

        }

    });
</script>

</body>
</html>
