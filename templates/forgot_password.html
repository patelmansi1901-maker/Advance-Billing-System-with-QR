<!DOCTYPE html>
<html>
<head>
    <title>Admin Forgot Password</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #ccc;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        button {
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        h2 { text-align: center; }
    </style>
</head>
<body>

<div class="container">

    <h2>Forgot Password</h2>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <label>Registered Admin Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">Send OTP</button>
    </form>

    <p style="text-align:center">
        <a href="{% url 'admin_login' %}">Back to Login</a>
    </p>

</div>

</body>
</html>
