<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration | Advanced Billing System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef3f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .registration-container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h2 {
            color: #174a82;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1769aa;
            box-shadow: 0 0 4px rgba(23,105,170,0.25);
        }

        .name-row {
            display: flex;
            gap: 15px;
        }

        .name-row .form-group {
            flex: 1;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-btn:hover {
            background: #104d82;
        }

        .register-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: #777;
        }

        @media(max-width: 500px) {
            .registration-container {
                padding: 23px;
            }

            .name-row {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="registration-container">

    <div class="header">
        <h2>Admin Registration</h2>
        <p>Advanced Billing System with QR</p>
        <p>Create a new admin account</p>
    </div>

    <div id="messageBox" class="message"></div>

    <form id="adminRegisterForm">

        {% csrf_token %}

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email address"
                required
            >
        </div>

        <div class="name-row">

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="First name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input
                    type="text"
                    id="last_name"
                    name="last_name"
                    placeholder="Last name"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                minlength="8"
                required
            >
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm password"
                minlength="8"
                required
            >
        </div>

        <button type="submit" class="register-btn" id="registerBtn">
            Register Admin
        </button>

    </form>

    <div class="footer">
        Authorized Admin Registration
    </div>

</div>

<script>
    const form = document.getElementById("adminRegisterForm");
    const messageBox = document.getElementById("messageBox");
    const registerBtn = document.getElementById("registerBtn");

    function showMessage(message, type) {
        messageBox.style.display = "block";
        messageBox.className = "message " + type;
        messageBox.innerHTML = message;
    }

    function getCookie(name) {
        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {
            cookie = cookie.trim();

            if (cookie.startsWith(name + "=")) {
                return decodeURIComponent(
                    cookie.substring(name.length + 1)
                );
            }
        }

        return "";
    }

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        const formData = {
            username: document.getElementById("username").value.trim(),
            email: document.getElementById("email").value.trim(),
            first_name: document.getElementById("first_name").value.trim(),
            last_name: document.getElementById("last_name").value.trim(),
            password: password
        };

        registerBtn.disabled = true;
        registerBtn.innerText = "Registering...";

        try {

            const response = await fetch(
                "{% url 'admin_register_api' %}",
                {
                    method: "POST",

                    credentials: "same-origin",

                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },

                    body: JSON.stringify(formData)
                }
            );

            const data = await response.json();

            if (response.ok) {

                showMessage(
                    "Admin registered successfully! Username: " +
                    data.username,
                    "success"
                );

                form.reset();

            } else {

                const errors = Object.entries(data)
                    .map(([field, messages]) => {
                        const message = Array.isArray(messages)
                            ? messages.join(", ")
                            : messages;

                        return field + ": " + message;
                    })
                    .join("<br>");

                showMessage(
                    errors || "Registration failed. Please try again.",
                    "error"
                );
            }

        } catch (error) {

            showMessage(
                "Unable to connect to the server. Please try again.",
                "error"
            );

        } finally {

            registerBtn.disabled = false;
            registerBtn.innerText = "Register Admin";

        }

    });
</script>

</body>
</html>
