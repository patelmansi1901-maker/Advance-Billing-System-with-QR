
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product</title>

    <link rel="stylesheet"
          href="{% static 'css/product.css' %}">
</head>

<body>

<div class="product-container">

    <div class="page-header">
        <div>
            <h2>Edit Product</h2>
            <p>Update the existing product information.</p>
        </div>

        <a href="{% url 'product_list' %}" class="add-btn">
            Back to Products
        </a>
    </div>

    <div class="form-card">

        <h4 class="mb-4">Update Product Information</h4>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Product Name</label>
                <input type="text"
                       name="name"
                       value="{{ product.name }}"
                       required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text"
                       name="category"
                       value="{{ product.category }}"
                       required>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number"
                       name="price"
                       value="{{ product.price }}"
                       min="0.01"
                       step="0.01"
                       required>
            </div>

            <div class="form-group">
                <label>Stock Quantity</label>
                <input type="number"
                       name="stock"
                       value="{{ product.stock }}"
                       min="0"
                       required>
            </div>

            <div class="form-group">
                <label>GST Rate (%)</label>

                <select name="gst_rate" required>
                    <option value="0" {% if product.gst_rate == 0 %}selected{% endif %}>0%</option>
                    <option value="5" {% if product.gst_rate == 5 %}selected{% endif %}>5%</option>
                    <option value="12" {% if product.gst_rate == 12 %}selected{% endif %}>12%</option>
                    <option value="18" {% if product.gst_rate == 18 %}selected{% endif %}>18%</option>
                    <option value="28" {% if product.gst_rate == 28 %}selected{% endif %}>28%</option>
                </select>
            </div>

            <button type="submit"
                    class="add-btn"
                    style="border:none; cursor:pointer;">
                Update Product
            </button>

        </form>

    </div>

</div>

</body>
</html>
