
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | BillFlow</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071b2b, #15394a);
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background: #12263a;
            border: 1px solid #294557;
            border-radius: 18px;
            box-sizing: border-box;
            box-shadow: 0 15px 40px #0005;
        }
        h1 { margin-top: 0; }
        h2 { margin-top: 28px; font-size: 19px; }
        p { color: #a9bfd0; line-height: 1.6; }
        label { display: block; margin: 16px 0 8px; }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #355267;
            border-radius: 9px;
            background: #0c1c2c;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            border: 0;
            border-radius: 9px;
            background: #70dfbd;
            color: #082235;
            font-weight: bold;
            cursor: pointer;
        }
        .notice, .error {
            padding: 12px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }
        .notice { background: #153f43; color: #a9f2dc; }
        .error { background: #482a35; color: #ffc3ce; }
        a { color: #70dfbd; }
        .secondary {
            background: transparent;
            border: 1px solid #70dfbd;
            color: #70dfbd;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Verify OTP</h1>
        <p>Enter the six-digit OTP generated for your password reset.</p>

        {% if notice %}
            <div class="notice">{{ notice }}</div>
        {% endif %}
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="verify_otp">

            <label for="otp">6-Digit OTP</label>
            <input
                type="text"
                id="otp"
                name="otp"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                required
            >
            <button type="submit">Verify OTP</button>
        </form>

        <form method="post" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="resend_otp">
            <button class="secondary" type="submit">Resend OTP</button>
        </form>

        <hr style="margin-top: 28px; border-color: #355267;">

        <h2>Create New Password</h2>

        <form method="post" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <input type="hidden" name="action" value="reset_password">

            <label for="new_password">New Password</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                autocomplete="new-password"
                placeholder="Enter new password"
                required
            >

            <label for="confirm_password">Confirm New Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <p><a href="{% url 'forgot_password' %}">Start again</a></p>
    </main>
</body>
</html>
